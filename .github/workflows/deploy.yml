name: Deploy to Hostinger VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_TOKEN
          script: |
            set -e
            cd /opt/miles-radar
            git pull https://x-access-token:$GH_TOKEN@github.com/felipefinfanfa/automacao-milhas-news.git master
            docker compose up -d --build
            docker compose ps
