name: Build & Deploy to Hostinger VPS (Swarm)

on:
  push:
    branches: [master]

env:
  IMAGE: ghcr.io/felipefinfanfa/radar-de-milhas

jobs:

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Swarm stack
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ghcr.io/felipefinfanfa/radar-de-milhas:latest
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            set -e

            # Ensure Swarm is initialised (idempotent)
            docker swarm init 2>/dev/null || true

            # Ensure overlay network exists
            docker network create --driver overlay --attachable felipefinfanfanet 2>/dev/null || true

            # Pull latest stack file (force-sync, discards any local changes on VPS)
            cd /opt/miles-radar
            git fetch https://x-access-token:${GHCR_TOKEN}@github.com/felipefinfanfa/automacao-milhas-news.git master
            git reset --hard FETCH_HEAD

            # Guard: .env must exist
            test -f .env || { echo "ERROR: /opt/miles-radar/.env missing — aborting"; exit 1; }

            # Login to GHCR and pull image
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pre-pull the image on the manager node
            docker pull "$IMAGE"

            # Deploy (or rolling-update) the stack
            docker stack deploy --with-registry-auth -c docker-stack.yml radar-de-milhas

            # Show status
            docker stack services radar-de-milhas
            docker stack ps radar-de-milhas --no-trunc
