services:
  scheduler:
    build:
      context: .
      target: runtime
    env_file: .env
    restart: unless-stopped
    mem_limit: 1g
    command: python -m src.scheduler
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
